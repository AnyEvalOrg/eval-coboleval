services:
  default:
    image: eval-cobol-sandbox:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /tmp
    user: "0:0"
    read_only: true
    # Anonymous disk-backed volume; the watchdog supplies the byte/inode bound.
    volumes:
      - type: volume
        target: /tmp
    tmpfs:
      - /dev/shm:ro,size=16m
    network_mode: none
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, SYS_PTRACE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
